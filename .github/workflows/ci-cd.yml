name: CI / CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

# Configura permisos para GitHub Pages si el deploy se realiza en main
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI: Verificación de código, Linting, Typecheck y Build
  # ---------------------------------------------------------------------------
  ci:
    name: Continuous Integration (Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Typecheck and Build
        run: npm run build

      - name: Upload production artifact (for deployment)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ---------------------------------------------------------------------------
  # CD: Continuous Deployment automático a GitHub Pages (solo en branch main)
  # ---------------------------------------------------------------------------
  cd:
    name: Continuous Deployment (GitHub Pages)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
